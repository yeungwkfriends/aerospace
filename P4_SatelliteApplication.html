<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人造衛星連連看遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        space: {
                            900: '#0B0D1B',
                            800: '#141833',
                            700: '#1F254B',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Microsoft JhengHei', 'PingFang HK', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.7)); }
            50% { filter: drop-shadow(0 0 22px rgba(59, 130, 246, 1)); }
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-pulse-glow { animation: pulse-glow 2.5s infinite; }
        .animate-float { animation: float-slow 4s ease-in-out infinite; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B0D1B; }
        ::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 4px; }

        .glass-panel {
            background: rgba(20, 24, 51, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .node-card {
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .node-card:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .connected-beam {
            stroke-dasharray: 8 6;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -28;
            }
        }
    </style>
</head>
<body class="bg-space-900 text-white min-h-screen flex flex-col font-sans overflow-x-hidden select-none selection:bg-blue-500 selection:text-white">

    <!-- Starfield Canvas Background -->
    <canvas id="starfield" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <header class="relative z-20 bg-space-800/90 border-b border-blue-500/30 px-4 py-2.5 sticky top-0 backdrop-blur-md shadow-md">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-2.5">
                <span class="text-3xl animate-bounce">🛰️</span>
                <div>
                    <h1 class="font-bold text-lg md:text-2xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-300 to-indigo-300">
                        人造衛星連連看遊戲
                    </h1>
                </div>
            </div>

            <!-- Game Stats HUD -->
            <div class="flex items-center space-x-3 bg-space-900/90 px-4 py-1.5 rounded-full border border-blue-500/40 text-sm md:text-base font-medium">
                <div class="flex items-center space-x-1.5">
                    <span>🎯 進度:</span>
                    <span id="progress-display" class="font-bold text-cyan-300 text-base md:text-lg">0 / 6</span>
                </div>
                <div class="h-4 w-[1px] bg-blue-500/30"></div>
                <div class="flex items-center space-x-1.5">
                    <span>⭐ 得分:</span>
                    <span id="score-display" class="font-bold text-yellow-400 text-base md:text-lg">0</span>
                </div>
                <div class="h-4 w-[1px] bg-blue-500/30"></div>
                <div class="flex items-center space-x-1.5">
                    <span>🔥 連擊:</span>
                    <span id="combo-display" class="font-bold text-emerald-400 text-base md:text-lg">0x</span>
                </div>
                <button id="sound-btn" onclick="toggleSound()" class="p-1 hover:bg-blue-800/40 rounded-full transition ml-1" title="聲音開關">
                    <span id="sound-icon" class="text-base">🔊</span>
                </button>
            </div>
        </div>
    </header>

    <main class="relative z-10 max-w-6xl mx-auto w-full p-3 md:p-4 flex-grow flex flex-col gap-3 justify-center">
        
        <!-- Game Instruction Banner -->
        <div class="glass-panel p-3 md:p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-3 border border-cyan-500/30 shadow-lg">
            <div class="flex items-center gap-3">
                <div class="text-2xl bg-blue-600/30 p-2 rounded-xl border border-blue-400/40 shrink-0">⚡</div>
                <div>
                    <h2 class="text-sm md:text-lg font-bold text-cyan-300">人造衛星與日常生活連連看</h2>
                    <p class="text-xs md:text-sm text-slate-200 mt-0.5">點選上方「衛星」再點選下方「地面應用」（每種衛星對應 2 個情境）！</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2.5 shrink-0">
                <button onclick="resetGame()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs md:text-sm font-semibold border border-slate-600 transition shadow">
                    🔄 重新開始
                </button>
                <button onclick="showHint()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs md:text-sm font-semibold shadow-lg transition">
                    💡 提示
                </button>
            </div>
        </div>

        <!-- Connection Playground Container -->
        <div id="game-playground" class="relative bg-gradient-to-b from-space-900 via-indigo-950/70 to-blue-950/90 rounded-xl p-3 md:p-5 border border-blue-500/40 shadow-2xl min-h-[440px] md:min-h-[480px] flex flex-col justify-between overflow-hidden">
            
            <!-- Dynamic Connection Beams Overlay (SVG Layer) -->
            <svg id="svg-connections" class="absolute inset-0 w-full h-full pointer-events-none z-10">
                <!-- Lines rendered dynamically via JS -->
            </svg>

            <!-- TOP ROW: 3 Satellite Types in Orbit -->
            <div class="relative z-20">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs md:text-sm font-bold text-cyan-400 bg-cyan-950/80 px-3 py-1 rounded-full border border-cyan-500/30">
                        🌌 選擇衛星
                    </span>
                    <span class="text-xs md:text-sm text-slate-300">每顆衛星對應 2 個實際應用</span>
                </div>
                
                <div id="satellites-container" class="grid grid-cols-3 gap-2.5 md:gap-4">
                    <!-- Satellite cards populated by JS -->
                </div>
            </div>

            <!-- Middle Beam Guide Indicator -->
            <div class="relative z-10 py-1.5 text-center pointer-events-none flex justify-center items-center my-2">
                <div id="connecting-guide" class="text-xs md:text-base font-medium text-cyan-300/90 bg-space-900/95 px-4 py-1.5 rounded-full border border-cyan-500/40 shadow-lg">
                    ✨ 請點選上方的人造衛星發射訊號，再選擇下方對應的實際應用！
                </div>
            </div>

            <!-- BOTTOM ROW: 6 Everyday Scenarios -->
            <div class="relative z-20">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs md:text-sm font-bold text-emerald-400 bg-emerald-950/80 px-3 py-1 rounded-full border border-emerald-500/30">
                        🌏 地面日常生活應用（點選完成連線）
                    </span>
                </div>
                
                <div id="scenarios-container" class="grid grid-cols-3 md:grid-cols-6 gap-2.5 md:gap-3">
                    <!-- Scenario cards populated by JS -->
                </div>
            </div>

        </div>

    </main>

    <!-- Educational Pop-up Modal -->
    <div id="edu-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-lg w-full rounded-2xl p-6 border border-cyan-400/50 shadow-2xl relative animate-float">
            <div class="flex items-center gap-3.5 mb-4">
                <span id="modal-icon" class="text-5xl">🎉</span>
                <div>
                    <h3 id="modal-title" class="text-xl md:text-2xl font-bold text-cyan-300">連線成功！</h3>
                </div>
            </div>

            <div class="bg-space-900/90 rounded-xl p-4 md:p-5 border border-slate-700/80 mb-5 text-base md:text-lg leading-relaxed space-y-3">
                <p id="modal-desc" class="text-slate-100">
                    --
                </p>
                <div class="bg-indigo-950/70 p-3 rounded-lg border border-indigo-500/40 text-xs md:text-sm text-indigo-200">
                    💡 <strong>課本重點學習：</strong> <span id="modal-fact">--</span>
                </div>
            </div>

            <button onclick="closeEduModal()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-base md:text-lg py-3 rounded-xl transition shadow-lg">
                繼續發射訊號 ➔
            </button>
        </div>
    </div>

    <!-- Victory Screen -->
    <div id="victory-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-lg flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 border border-yellow-500/50 shadow-2xl text-center space-y-4">
            <div class="text-6xl animate-bounce">🏆</div>
            <h3 class="text-2xl md:text-3xl font-bold text-yellow-300">任務全數完成！</h3>
            <p class="text-base md:text-lg text-slate-200">你成功將所有 3 種人造衛星與 6 個日常生活應用精準連線！</p>
            
            <div class="bg-space-900/90 rounded-xl p-4 border border-yellow-500/30 text-base md:text-lg space-y-2">
                <div class="flex justify-between">
                    <span class="text-slate-300">最終得分:</span>
                    <span id="final-score" class="font-bold text-yellow-400">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-300">獲得勳章:</span>
                    <span class="font-bold text-cyan-300">🏅 人造衛星常識大師</span>
                </div>
            </div>

            <button onclick="resetGame()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-space-900 font-bold text-lg py-3 rounded-xl transition shadow-lg">
                再玩一次 🔄
            </button>
        </div>
    </div>

    <script>
        /* -------------------------------------------------------------
           Audio Context & Sound Effects
        ------------------------------------------------------------- */
        let soundEnabled = true;

        function playAudio(type) {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'connect-correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.18, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(160, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'victory') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.12);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.24);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.36);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                }
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-icon').innerText = soundEnabled ? '🔊' : '🔇';
        }

        /* -------------------------------------------------------------
           Game Data (3 Satellites, 6 Daily Scenarios - 2 per type)
        ------------------------------------------------------------- */
        const satelliteTypes = [
            { 
                id: "sat-comm", 
                type: "comm", 
                name: "通訊衛星", 
                icon: "📡", 
                color: "border-indigo-500 text-indigo-300 bg-indigo-950/60",
                badgeColor: "bg-indigo-500/20 text-indigo-300 border-indigo-400/40"
            },
            { 
                id: "sat-gps", 
                type: "gps", 
                name: "導航定位衛星", 
                icon: "🗺️", 
                color: "border-emerald-500 text-emerald-300 bg-emerald-950/60",
                badgeColor: "bg-emerald-500/20 text-emerald-300 border-emerald-400/40"
            },
            { 
                id: "sat-weather", 
                type: "weather", 
                name: "氣象衛星", 
                icon: "🌀", 
                color: "border-amber-500 text-amber-300 bg-amber-950/60",
                badgeColor: "bg-amber-500/20 text-amber-300 border-amber-400/40"
            }
        ];

        const dailyScenarios = [
            { 
                id: "sc-tv", 
                matchType: "comm", 
                name: "奧運會直播", 
                icon: "📺", 
                desc: "觀看奧運會現場直播新聞",
                explanation: "通訊衛星負責接收體育場館的電視訊號，並將影像與聲音即時跨國傳送到香港的電視！",
                fact: "因為地球是球形的，無線電波無法穿透大山，需要通訊衛星在太空像「接力棒」一樣轉播。"
            },
            { 
                id: "sc-videocall", 
                matchType: "comm", 
                name: "跨國視訊通話", 
                icon: "📲", 
                desc: "與英國的親友進行視訊通話",
                explanation: "通訊衛星在全球搭建訊號橋樑，將我們的聲音與視訊數據以光速傳送到世界各地！",
                fact: "通訊衛星運行在距離地面約 36,000 公里的地球靜止軌道上。"
            },
            { 
                id: "sc-bus-eta", 
                matchType: "gps", 
                name: "巴士到站預報", 
                icon: "🚌", 
                desc: "查看巴士還要多久到達",
                explanation: "巴士上裝有衛星定位接收器，透過導航定位衛星隨時計算車輛精確位置，並即時預算巴士抵達車站的時間！",
                fact: "香港的九巴和城巴 App 都是利用 GPS 導航衛星定位來提供實時到站預報服務。"
            },
            { 
                id: "sc-delivery", 
                matchType: "gps", 
                name: "外賣追蹤", 
                icon: "🛵", 
                desc: "查看你的外賣在哪裏",
                explanation: "外賣 App 運用導航衛星進行實時定位，讓顧客能精準掌握外賣員的位置與預計到達時間！",
                fact: "GPS 系統需要最少 4 顆衛星同時發送波段，才能實現超高精準度的三維定位。"
            },
            { 
                id: "sc-typhoon", 
                matchType: "weather", 
                name: "颱風路徑監測", 
                icon: "🌀", 
                desc: "追蹤熱帶氣旋風眼",
                explanation: "氣象衛星從數萬公里的太空拍攝地球雲圖，追蹤熱帶氣旋（颱風）的形成與移動路徑！",
                fact: "香港天文台發出八號風球警告前，都會利用氣象衛星照片觀察颱風眼位置。"
            },
            { 
                id: "sc-raincloud", 
                matchType: "weather", 
                name: "暴雨雲圖觀察", 
                icon: "🌧️", 
                desc: "監測暴雨積雨雲發展",
                explanation: "氣象衛星配備感應器，能觀察大氣層中的積雨雲發展，協助天文台預測大雨並發出警告！",
                fact: "氣象衛星每天多次拍照，為大家出門上學提供準確的天候預報資訊。"
            }
        ];

        /* -------------------------------------------------------------
           Global Game State
        ------------------------------------------------------------- */
        let gameState = {
            score: 0,
            combo: 0,
            selectedSatellite: null, // { data, el }
            connections: [] // array of { satId, scenarioId, type }
        };

        /* -------------------------------------------------------------
           Game Logic & UI Rendering
        ------------------------------------------------------------- */
        function initGame() {
            gameState.score = 0;
            gameState.combo = 0;
            gameState.selectedSatellite = null;
            gameState.connections = [];

            document.getElementById('score-display').innerText = '0';
            document.getElementById('combo-display').innerText = '0x';
            document.getElementById('progress-display').innerText = '0 / 6';

            // Clear SVG lines
            document.getElementById('svg-connections').innerHTML = '';

            // Render Satellites (3 types) with enlarged font sizes
            const satContainer = document.getElementById('satellites-container');
            satContainer.innerHTML = '';

            satelliteTypes.forEach(sat => {
                const satEl = document.createElement('div');
                satEl.id = sat.id;
                satEl.className = `node-card cursor-pointer glass-panel p-2.5 md:p-3.5 rounded-xl border ${sat.color} flex flex-col items-center text-center shadow-lg relative`;
                satEl.onclick = () => handleSatelliteClick(sat, satEl);

                satEl.innerHTML = `
                    <span class="text-3xl md:text-4xl mb-1 animate-pulse-glow">${sat.icon}</span>
                    <span class="font-bold text-base md:text-lg">${sat.name}</span>
                    <div class="flex items-center gap-1.5 mt-1.5 text-xs md:text-sm bg-space-900/90 px-2.5 py-0.5 rounded-full border border-slate-700">
                        <span>已連線:</span>
                        <span id="counter-${sat.type}" class="font-bold text-cyan-300 text-xs md:text-sm">0 / 2</span>
                    </div>
                    <div class="node-dot absolute -bottom-1.5 w-3.5 h-3.5 rounded-full bg-cyan-400 border-2 border-space-900 shadow"></div>
                `;
                satContainer.appendChild(satEl);
            });

            // Render Scenarios (6 items - shuffled) with enlarged text
            const scContainer = document.getElementById('scenarios-container');
            scContainer.innerHTML = '';

            const shuffledScenarios = [...dailyScenarios].sort(() => Math.random() - 0.5);

            shuffledScenarios.forEach(sc => {
                const scEl = document.createElement('div');
                scEl.id = sc.id;
                scEl.className = `node-card cursor-pointer glass-panel p-2 md:p-3 rounded-xl border border-slate-700 hover:border-emerald-400 text-slate-200 flex flex-col items-center text-center shadow-lg relative justify-between min-h-[120px] md:min-h-[135px]`;
                scEl.onclick = () => handleScenarioClick(sc, scEl);

                scEl.innerHTML = `
                    <div class="node-dot absolute -top-1.5 w-3.5 h-3.5 rounded-full bg-emerald-400 border-2 border-space-900 shadow"></div>
                    <span class="text-2xl md:text-3xl my-0.5">${sc.icon}</span>
                    <span class="font-bold text-xs md:text-base text-emerald-300 mb-0.5 leading-snug">${sc.name}</span>
                    <span class="text-[11px] md:text-xs text-slate-300 leading-tight line-clamp-2">${sc.desc}</span>
                `;
                scContainer.appendChild(scEl);
            });

            updateGuideText('✨ 請先點選上方的人造衛星，然後點選地面情境發射波段連線！');
        }

        function handleSatelliteClick(sat, satEl) {
            playAudio('select');

            // Deselect previous
            document.querySelectorAll('#satellites-container .node-card').forEach(el => {
                el.classList.remove('ring-4', 'ring-cyan-400', 'scale-105');
            });

            // Select new
            satEl.classList.add('ring-4', 'ring-cyan-400', 'scale-105');
            gameState.selectedSatellite = { data: sat, el: satEl };

            updateGuideText(`✨ 已選擇「${sat.name}」，現在點選下方的「日常生活應用」進行連線！`);
        }

        function handleScenarioClick(scenario, scEl) {
            if (!gameState.selectedSatellite) {
                playAudio('wrong');
                shakeElement(scEl);
                updateGuideText('⚠️ 請先在上方點選一顆人造衛星！');
                return;
            }

            const sat = gameState.selectedSatellite.data;
            const satEl = gameState.selectedSatellite.el;

            // Check if scenario is already connected
            const alreadyConnected = gameState.connections.find(c => c.scenarioId === scenario.id);
            if (alreadyConnected) {
                updateGuideText('ℹ️ 這個日常應用已經連線成功囉！');
                return;
            }

            // Check match
            if (sat.type === scenario.matchType) {
                // CORRECT MATCH!
                playAudio('connect-correct');

                gameState.combo++;
                const earnedScore = 20 * gameState.combo;
                gameState.score += earnedScore;

                document.getElementById('score-display').innerText = gameState.score;
                document.getElementById('combo-display').innerText = `${gameState.combo}x`;

                // Draw SVG Beam Line
                drawBeamLine(satEl, scEl, sat.type);

                // Update scenario UI
                scEl.classList.remove('border-slate-700');
                scEl.classList.add('border-emerald-400', 'bg-emerald-950/60', 'pointer-events-none');

                gameState.connections.push({
                    satId: sat.id,
                    scenarioId: scenario.id,
                    type: sat.type
                });

                // Update counter on satellite
                const connectedCountForSat = gameState.connections.filter(c => c.type === sat.type).length;
                document.getElementById(`counter-${sat.type}`).innerText = `${connectedCountForSat} / 2`;

                // Update total progress
                document.getElementById('progress-display').innerText = `${gameState.connections.length} / 6`;

                // Clear satellite selection highlight
                satEl.classList.remove('ring-4', 'ring-cyan-400', 'scale-105');
                gameState.selectedSatellite = null;

                // Show Educational Modal
                showEduModal(scenario);

                // Check Victory (6 connections)
                if (gameState.connections.length === 6) {
                    setTimeout(() => {
                        showVictoryModal();
                    }, 1200);
                }

            } else {
                // WRONG MATCH
                playAudio('wrong');
                gameState.combo = 0;
                document.getElementById('combo-display').innerText = '0x';

                shakeElement(scEl);
                shakeElement(satEl);

                updateGuideText(`❌ 「${sat.name}」無法負責「${scenario.name}」，再試一次！`);
            }
        }

        /* -------------------------------------------------------------
           SVG Connection Beam Renderer
        ------------------------------------------------------------- */
        function drawBeamLine(startEl, endEl, type) {
            const svg = document.getElementById('svg-connections');
            const svgRect = svg.getBoundingClientRect();

            const startRect = startEl.getBoundingClientRect();
            const endRect = endEl.getBoundingClientRect();

            // Calculate anchor coordinates relative to SVG
            const x1 = startRect.left + startRect.width / 2 - svgRect.left;
            const y1 = startRect.bottom - svgRect.top - 6;

            const x2 = endRect.left + endRect.width / 2 - svgRect.left;
            const y2 = endRect.top - svgRect.top + 6;

            let color = '#38bdf8'; // cyan default
            if (type === 'comm') color = '#818cf8'; // indigo
            if (type === 'gps') color = '#34d399'; // emerald
            if (type === 'weather') color = '#fbbf24'; // amber

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const deltaY = Math.abs(y2 - y1) * 0.5;
            const d = `M ${x1} ${y1} C ${x1} ${y1 + deltaY}, ${x2} ${y2 - deltaY}, ${x2} ${y2}`;

            path.setAttribute('d', d);
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', '4');
            path.setAttribute('fill', 'none');
            path.setAttribute('class', 'connected-beam');

            svg.appendChild(path);
        }

        // Redraw lines on window resize
        window.addEventListener('resize', () => {
            const svg = document.getElementById('svg-connections');
            svg.innerHTML = '';
            gameState.connections.forEach(conn => {
                const startEl = document.getElementById(conn.satId);
                const endEl = document.getElementById(conn.scenarioId);
                if (startEl && endEl) {
                    drawBeamLine(startEl, endEl, conn.type);
                }
            });
        });

        /* -------------------------------------------------------------
           Modals and Helper Functions
        ------------------------------------------------------------- */
        function updateGuideText(msg) {
            const guide = document.getElementById('connecting-guide');
            guide.innerText = msg;
        }

        function shakeElement(el) {
            el.classList.add('animate-bounce');
            setTimeout(() => el.classList.remove('animate-bounce'), 500);
        }

        function showEduModal(scenario) {
            document.getElementById('modal-icon').innerText = scenario.icon;
            document.getElementById('modal-title').innerText = `連線成功：${scenario.name}`;
            document.getElementById('modal-desc').innerText = scenario.explanation;
            document.getElementById('modal-fact').innerText = scenario.fact;
            document.getElementById('edu-modal').classList.remove('hidden');
        }

        function closeEduModal() {
            playAudio('select');
            document.getElementById('edu-modal').classList.add('hidden');
        }

        function showVictoryModal() {
            playAudio('victory');
            document.getElementById('final-score').innerText = gameState.score;
            document.getElementById('victory-modal').classList.remove('hidden');
        }

        function resetGame() {
            playAudio('select');
            document.getElementById('victory-modal').classList.add('hidden');
            initGame();
        }

        function showHint() {
            playAudio('select');
            const uncompleted = dailyScenarios.find(sc => !gameState.connections.some(c => c.scenarioId === sc.id));
            if (uncompleted) {
                const matchSat = satelliteTypes.find(s => s.type === uncompleted.matchType);
                updateGuideText(`💡 提示：試試將「${matchSat.name}」與「${uncompleted.name}」進行連線！`);
            } else {
                updateGuideText('🎉 恭喜！你已經完成所有連線任務！');
            }
        }

        /* -------------------------------------------------------------
           Starfield Background Animation
        ------------------------------------------------------------- */
        function initStarfield() {
            const bgCanvas = document.getElementById('starfield');
            const bgCtx = bgCanvas.getContext('2d');
            let stars = [];

            function resize() {
                bgCanvas.width = window.innerWidth;
                bgCanvas.height = window.innerHeight;
                stars = Array.from({ length: 70 }, () => ({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    size: Math.random() * 2,
                    alpha: Math.random()
                }));
            }

            window.addEventListener('resize', resize);
            resize();

            function animateStars() {
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                stars.forEach(star => {
                    star.alpha += (Math.random() - 0.5) * 0.02;
                    if (star.alpha < 0.2) star.alpha = 0.2;
                    if (star.alpha > 1) star.alpha = 1;

                    bgCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                    bgCtx.beginPath();
                    bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    bgCtx.fill();
                });
                requestAnimationFrame(animateStars);
            }
            animateStars();
        }

        /* Start Game on Load */
        window.onload = function() {
            initStarfield();
            initGame();
        };
    </script>
